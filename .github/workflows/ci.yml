name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Frontend and shared version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '26.12.0'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check:version
      - run: vp check
      - run: vp test
      - run: vp run build
      - name: Check Pages asset limits
        shell: bash
        run: |
          oversized=$(find dist -type f -size +26214400c -print)
          if [ -n "$oversized" ]; then
            printf 'Pages assets exceed 25 MiB:\n%s\n' "$oversized"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pages-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  server:
    name: Server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --package rust-path-server --target ${{ matrix.target }}
      - name: Package and smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/server/Cargo.toml | head -n 1)
          binary=rust-path-server
          if [[ "$TARGET" == *windows* ]]; then binary+=.exe; fi
          "target/$TARGET/release/$binary" --version | grep -Fx "rust-path-server $version"
          mkdir -p staging artifacts
          cp "target/$TARGET/release/$binary" staging/
          if [[ "$TARGET" == *windows* ]]; then
            7z a "artifacts/rust-path-server-v$version-$TARGET.zip" ./staging/*
          else
            tar -czf "artifacts/rust-path-server-v$version-$TARGET.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
